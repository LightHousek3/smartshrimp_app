name: smartshrimp_app
description: "SmartShrimp mobile app for technicians and farm owners."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  uuid: ^4.5.3
  webview_flutter: ^4.14.1
  socket_io_client: ^3.1.6
  flutter_svg: ^2.3.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0
  freezed: ^3.1.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/rag/
    - assets/fonts/google_fonts/
